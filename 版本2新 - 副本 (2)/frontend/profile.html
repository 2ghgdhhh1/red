<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=yes" />
    <title>个人中心 - 红色回响</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* 复制原index.html样式，保证导航栏一致 */
        .main-nav {
            list-style: none;
            display: flex;
            align-items: center;
            background-color: #f7f3e9;
            padding: 14px 20px;
            width: 100%;
            gap: 0;
            margin: 0;
        }
        .main-nav .search-box {
            margin: 0 auto;
            width: 360px;
            max-width: 40%;
        }
        .main-nav li {
            margin-left: 24px;
        }
        .main-nav a {
            color: #9b0c22;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .main-nav a:hover {
            background-color: #f1e6d5;
            transform: translateY(-1px);
            color: #7a091a;
        }
        .search-box {
            display: flex;
            align-items: center;
        }
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
            outline: none;
        }
        .search-input:focus {
            background-color: #fffdfa;
            box-shadow: 0 0 6px rgba(155, 12, 34, 0.25);
        }
        .search-btn {
            padding: 12px 25px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            font-size: 16px;
            cursor: pointer;
        }
        .search-btn:hover {
            background-color: #d10a0a;
        }
        body {
            background-color: #FFF8E1;
            font-family: "SimSun", "Microsoft YaHei", serif;
            padding-top: 70px;
        }
        /* 个人中心卡片样式 */
        .profile-card {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 30px;
        }
        /* 头像容器 */
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            cursor: pointer;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #B71C1C;
            background-color: #f0f0f0;
        }
        .avatar-default {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #B71C1C;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        .camera-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            background: white;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
        }
        /* 昵称行 */
        .nickname-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .nickname-text {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .edit-nickname {
            cursor: pointer;
            color: #B71C1C;
            font-size: 18px;
            transition: 0.2s;
        }
        .edit-nickname:hover {
            transform: scale(1.1);
        }
        /* 原地编辑框样式 */
        .nickname-edit-area {
            display: none;
            align-items: center;
            gap: 8px;
        }
        .nickname-edit-input {
            font-size: 20px;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 180px;
        }
        .nickname-edit-btn {
            background: #B71C1C;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .nickname-edit-btn:hover {
            background: #8b0000;
        }
        .nickname-edit-cancel {
            background: #6c757d;
        }
        .nickname-edit-cancel:hover {
            background: #5a6268;
        }
        /* 统计卡片行 */
        .stats-row {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            text-align: center;
        }
        .stat-card {
            flex: 1;
            padding: 12px;
            background: #fef7e0;
            border-radius: 16px;
            margin: 0 8px;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #B71C1C;
        }
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        /* 最近阅读列表 - 添加可点击样式 */
        .recent-list {
            margin: 20px 0;
        }
        .recent-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .recent-item:hover {
            background-color: #fef0e0;
        }
        .btn-logout {
            background-color: #B71C1C;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            width: 100%;
            font-size: 16px;
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn-logout:hover {
            background-color: #8b0000;
        }
        footer {
            background-color: #1a1a1a;
            color: #999;
            padding: 30px 0;
            margin-top: 50px;
            text-align: center;
        }
        @media (max-width: 600px) {
            .stats-row {
                flex-direction: column;
                gap: 12px;
            }
            .stat-card {
                margin: 0;
            }
        }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="main-nav fixed-top">
    <div class="search-box">
        <input type="text" class="search-input" placeholder="搜索你想查询的红色报纸">
        <button class="search-btn">搜索</button>
    </div>
    <li><a href="index.html">🏠首页</a></li>
    <li><a href="paper.html">📰回响报</a></li>
    <li><a href="volume-detail.html">📚回声册</a></li>
    <li><a href="profile.html">👤个人中心</a></li>
</nav>

<div class="profile-card">
    <div class="avatar-container" id="avatarContainer">
        <div id="avatarDisplay" class="avatar-default">
            <i class="fas fa-user"></i>
        </div>
        <div class="camera-icon">
            <i class="fas fa-camera fa-sm"></i>
        </div>
    </div>

    <!-- 昵称显示区域 + 原地编辑区域 -->
    <div class="nickname-row">
        <div id="nicknameDisplay" class="nickname-text">加载中...</div>
        <div id="nicknameEditArea" class="nickname-edit-area">
            <input type="text" id="nicknameEditInput" class="nickname-edit-input" maxlength="20">
            <button id="nicknameEditConfirm" class="nickname-edit-btn">确定</button>
            <button id="nicknameEditCancel" class="nickname-edit-btn nickname-edit-cancel">取消</button>
        </div>
        <i class="fas fa-pencil-alt edit-nickname" id="editNicknameBtn"></i>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-number" id="readIssues">0</div>
            <div class="stat-label">已读期数</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="readDuration">0</div>
            <div class="stat-label">已读时长（分钟）</div>
        </div>
    </div>

    <h5><i class="fas fa-history"></i> 最近阅读</h5>
    <div class="recent-list" id="recentList">
        <div class="recent-item">加载中...</div>
    </div>

    <button class="btn-logout" id="logoutBtn">🚪 退出登录</button>
</div>

<footer>
    <div class="container text-center">
        <p>© 2026 红色回响. 保留所有权利.</p>
        <p>本网站旨在弘扬红色文化，传承革命精神。</p>
    </div>
</footer>

<script>
    const API_BASE = 'http://localhost:8000';
    // 获取存储的用户ID（登录时保存）
    function getUserId() {
        return localStorage.getItem('user_id');
    }

    // 头像、昵称等本地存储相关
    const STORAGE_AVATAR = 'red_avatar';
    const STORAGE_NICKNAME = 'red_nickname';
    const STORAGE_CURRENT_USER = 'red_daily_current_user';

    // 初始化昵称（若不存在则生成随机数）
    function initUserData() {
        if (!localStorage.getItem(STORAGE_NICKNAME)) {
            const randomNum = Math.floor(Math.random() * 90000000 + 10000000);
            localStorage.setItem(STORAGE_NICKNAME, randomNum.toString());
        }
    }
    function renderAvatar() {
        const avatarBase64 = localStorage.getItem(STORAGE_AVATAR);
        const avatarDisplay = document.getElementById('avatarDisplay');
        if (avatarBase64) {
            avatarDisplay.innerHTML = `<img src="${avatarBase64}" class="avatar-img" alt="头像">`;
        } else {
            avatarDisplay.innerHTML = `<i class="fas fa-user"></i>`;
            avatarDisplay.className = 'avatar-default';
        }
    }
    function renderNickname() {
        const nickname = localStorage.getItem(STORAGE_NICKNAME) || '读者';
        document.getElementById('nicknameDisplay').innerText = nickname;
        // 同步编辑框的初始值
        document.getElementById('nicknameEditInput').value = nickname;
    }
    function changeAvatar() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment';
        input.onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const base64 = ev.target.result;
                localStorage.setItem(STORAGE_AVATAR, base64);
                renderAvatar();
            };
            reader.readAsDataURL(file);
        };
        input.click();
    }

    // 原地编辑昵称逻辑
    function enableNicknameEdit() {
        const displayDiv = document.getElementById('nicknameDisplay');
        const editArea = document.getElementById('nicknameEditArea');
        const editIcon = document.getElementById('editNicknameBtn');
        const input = document.getElementById('nicknameEditInput');
        // 显示编辑区，隐藏显示文本和铅笔图标
        displayDiv.style.display = 'none';
        editArea.style.display = 'flex';
        editIcon.style.display = 'none';
        input.focus();
        input.select();
    }

    function saveNickname() {
        const newName = document.getElementById('nicknameEditInput').value.trim();
        if (newName === '') {
            // 如果为空，恢复原昵称
            cancelNicknameEdit();
            return;
        }
        // 保存到 localStorage
        localStorage.setItem(STORAGE_NICKNAME, newName);
        renderNickname(); // 更新显示区域文本
        cancelNicknameEdit(); // 退出编辑模式
    }

    function cancelNicknameEdit() {
        const displayDiv = document.getElementById('nicknameDisplay');
        const editArea = document.getElementById('nicknameEditArea');
        const editIcon = document.getElementById('editNicknameBtn');
        // 恢复显示区域
        displayDiv.style.display = 'block';
        editArea.style.display = 'none';
        editIcon.style.display = 'block';
        // 将编辑框的值重置为当前昵称
        const currentNick = localStorage.getItem(STORAGE_NICKNAME) || '读者';
        document.getElementById('nicknameEditInput').value = currentNick;
    }

    // 已读期数接口
    async function fetchReadIssues() {
        const userId = getUserId();
        if (!userId) {
            console.warn('未找到用户ID');
            return;
        }
        try {
            const res = await fetch(`${API_BASE}/api/user/read_issues?user_id=${userId}`);
            const data = await res.json();
            if (data.code === 200 && data.data && typeof data.data.read_issues !== 'undefined') {
                document.getElementById('readIssues').innerText = data.data.read_issues;
            } else {
                console.error('获取已读期数失败', data);
            }
        } catch(e) { console.error(e); }
    }

    // 阅读总时长接口（分钟）
    async function fetchReadDuration() {
        const userId = getUserId();
        if (!userId) return;
        try {
            const res = await fetch(`${API_BASE}/api/reading/duration?user_id=${userId}`);
            const data = await res.json();
            if (data.code === 200 && data.data && typeof data.data.total_duration !== 'undefined') {
                document.getElementById('readDuration').innerText = data.data.total_duration;
            }
        } catch(e) { console.error(e); }
    }

    // 最近阅读列表接口（添加点击跳转功能）
    async function fetchRecentHistory() {
        const userId = getUserId();
        if (!userId) return;
        try {
            const res = await fetch(`${API_BASE}/api/reading/history?user_id=${userId}&limit=5`);
            const data = await res.json();
            const container = document.getElementById('recentList');
            if (data.code === 200 && Array.isArray(data.data)) {
                if (data.data.length === 0) {
                    container.innerHTML = '<div class="recent-item">暂无阅读记录</div>';
                } else {
                    container.innerHTML = data.data.map(item => `
                        <div class="recent-item" onclick="location.href='paper.html?id=${item.issue_id}'">
                            <span>📰 ${escapeHtml(item.issue_title)}</span>
                            <span style="color:#999;">${escapeHtml(item.issue_date)}</span>
                        </div>
                    `).join('');
                }
            } else {
                container.innerHTML = '<div class="recent-item">加载失败</div>';
            }
        } catch(e) {
            console.error(e);
            document.getElementById('recentList').innerHTML = '<div class="recent-item">网络错误</div>';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function logout() {
        localStorage.removeItem(STORAGE_CURRENT_USER);
        localStorage.removeItem('token');
        localStorage.removeItem('user_id');
        window.location.href = 'signup.html';
    }

    // 初始化所有
    initUserData();
    renderAvatar();
    renderNickname();
    fetchReadIssues();
    fetchReadDuration();
    fetchRecentHistory();

    // 事件绑定
    document.getElementById('avatarContainer').addEventListener('click', changeAvatar);
    document.getElementById('editNicknameBtn').addEventListener('click', enableNicknameEdit);
    document.getElementById('nicknameEditConfirm').addEventListener('click', saveNickname);
    document.getElementById('nicknameEditCancel').addEventListener('click', cancelNicknameEdit);
    document.getElementById('logoutBtn').addEventListener('click', logout);
</script>
<!-- 引入全局搜索脚本 -->
<script src="search.js"></script>
</body>
</html>
