<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - 红色回响</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 公共导航栏样式（与其它页面保持一致） */
        .main-nav {
            list-style: none;
            display: flex;
            align-items: center;
            background-color: #f7f3e9;
            padding: 14px 20px;
            width: 100%;
            gap: 0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .main-nav .search-box {
            margin: 0 auto;
            width: 360px;
            max-width: 40%;
        }
        .main-nav li {
            margin-left: 24px;
        }
        .main-nav a {
            color: #9b0c22;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.25s ease;
        }
        .main-nav a:hover {
            background-color: #f1e6d5;
            color: #7a091a;
        }
        .search-box {
            display: flex;
            align-items: center;
        }
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
            outline: none;
        }
        .search-btn {
            padding: 12px 25px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }
        body {
            background-color: #FFF8E1;
            font-family: "SimSun", "Microsoft YaHei", serif;
            padding-top: 80px;
        }
        .result-container {
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .result-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .result-item:hover {
            background-color: #fef7e0;
            padding-left: 10px;
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #B71C1C;
        }
        .result-date {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        .no-result {
            text-align: center;
            padding: 50px;
            color: #999;
        }
    </style>
</head>
<body>

<!-- 公共导航栏（与其它页面一致，方便再次搜索） -->
<ul class="main-nav">
    <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索你想查询的红色报纸">
        <button class="search-btn" id="searchBtn">搜索</button>
    </div>
    <li><a href="index.html">🏠首页</a></li>
    <li><a href="paper.html">📰回响报</a></li>
    <li><a href="volume-detail.html">📚回声册</a></li>
    <li><a href="profile.html">👤个人中心</a></li>
</ul>

<div class="result-container" id="resultContainer">
    <h3>搜索结果：<span id="keywordSpan"></span></h3>
    <div id="resultList">加载中...</div>
</div>

<script src="search.js"></script>
<script>
    // 页面加载时从URL获取关键词并搜索
    const urlParams = new URLSearchParams(window.location.search);
    const keyword = urlParams.get('q');
    if (keyword) {
        document.getElementById('keywordSpan').innerText = decodeURIComponent(keyword);
        performSearch(decodeURIComponent(keyword));
    } else {
        document.getElementById('resultList').innerHTML = '<div class="no-result">请输入关键词进行搜索</div>';
    }

    // 绑定当前页面的搜索按钮（方便用户在搜索结果页继续搜索）
    document.getElementById('searchBtn').addEventListener('click', () => {
        const newKeyword = document.getElementById('searchInput').value.trim();
        if (newKeyword) {
            window.location.href = `search-results.html?q=${encodeURIComponent(newKeyword)}`;
        }
    });
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('searchBtn').click();
        }
    });
</script>

</body>
</html>
