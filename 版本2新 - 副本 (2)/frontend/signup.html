<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红色经典学习平台 - 个人中心</title>
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- 引入Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* 导航栏样式：米黄色背景、在标题上方 */
        .main-nav {
            list-style: none;
            display: flex;
            align-items: center;
            background-color: #f7f3e9; /* 米黄色 */
            padding: 14px 20px;
            width: 100%;
            gap: 0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        /* 搜索框：放在中间靠左 */
        .main-nav .search-box {
            margin: 0 auto;
            width: 360px;
            max-width: 40%;
        }
        /* 右侧四个导航 */
        .main-nav li {
            margin-left: 24px;
        }
        /* 其他导航项样式 */
        .main-nav a {
            color: #9b0c22;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .main-nav a:hover {
            background-color: #f1e6d5;
            transform: translateY(-1px);
            color: #7a091a;
        }
        /* 搜索栏样式 */
        .search-box {
            display: flex;
            align-items: center;
        }
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-input:focus {
            background-color: #fffdfa;
            box-shadow: 0 0 6px rgba(155, 12, 34, 0.25);
        }
        .search-btn {
            padding: 12px 25px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .search-btn:hover {
            background-color: #d10a0a;
        }
        .search-btn:active {
            transform: scale(0.96);
        }
    </style>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <!-- 公共导航组件 -->
    <ul class="main-nav">
        <div class="search-box">
            <input type="text" class="search-input" placeholder="搜索你想查询的红色报纸">
            <button class="search-btn">搜索</button>
        </div>
        <li><a href="index.html">🏠首页</a></li>
        <li><a href="paper.html">📰回响报</a></li>
        <li><a href="volume-detail.html">📚回声册</a></li>
        <li><a href="signup.html">👤个人中心</a></li>
    </ul>

    <!-- 底层背景轮播 -->
    <div class="bg-carousel">
        <div class="carousel-slide slide1"></div>
        <div class="carousel-slide slide2"></div>
        <div class="carousel-slide slide3"></div>
    </div>

    <!-- 全局加载提示（用于“注册中...”等） -->
    <div class="loading-toast" id="loadingToast">注册中...</div>

    <!-- 自定义模态框（带确定按钮） -->
    <div id="customModal" class="custom-modal">
        <div class="custom-modal-content">
            <p id="modalMessage">提示信息</p>
            <button id="modalOkBtn" class="modal-ok-btn">确定</button>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="center-container">
        <div class="left-info-card">
            <h1>欢迎来到红色文化学习平台</h1>
            <p class="subtitle">先注册来开启红色学习之旅</p>
            <p class="switch-tip">已有账号？<a href="javascript:;" class="login-link" id="goLoginLink">去登录</a></p>
        </div>

        <div class="right-form-card">
            <input type="radio" name="form-tab" id="signup-tab" checked>
            <input type="radio" name="form-tab" id="login-tab">
            
            <div class="tab-bar">
                <label for="signup-tab" class="tab-btn">注册</label>
                <label for="login-tab" class="tab-btn">登录</label>
            </div>

            <!-- 注册表单 -->
            <div class="form-container signup-form">
                <div class="input-group">
                    <input type="text" placeholder="用户名" id="signupUsername">
                    <input type="password" placeholder="密码" id="signupPwd">
                    <input type="password" placeholder="再次确认密码" id="signupPwdConfirm">
                </div>
                <button class="btn-submit" id="signupBtn">注册</button>
            </div>

            <!-- 登录表单 -->
            <div class="form-container login-form">
                <div class="input-group">
                    <input type="text" placeholder="用户名" id="loginUsername">
                    <input type="password" placeholder="密码" id="loginPwd">
                </div>
                <button class="btn-submit" id="loginBtn">登录</button>
            </div>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
