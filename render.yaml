services:
  - type: web
    name: red-echo-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COZE_API_TOKEN
        sync: false   # 手动在 Dashboard 设置
      - key: BOT_ID
        sync: false
  - type: web
    name: red-echo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html